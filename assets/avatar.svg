<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Developer workspace illustration">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <circle cx="240" cy="240" r="220" fill="url(#bgGrad)"/>
  <circle cx="240" cy="240" r="220" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.35"/>

  <!-- Floating dots -->
  <circle cx="90" cy="120" r="5" fill="#06B6D4" opacity="0.7"/>
  <circle cx="400" cy="90" r="4" fill="#3B82F6" opacity="0.6"/>
  <circle cx="410" cy="360" r="6" fill="#3B82F6" opacity="0.5"/>
  <circle cx="70" cy="360" r="4" fill="#06B6D4" opacity="0.6"/>

  <!-- Laptop base -->
  <rect x="120" y="300" width="240" height="14" rx="6" fill="#334155"/>
  <rect x="100" y="308" width="280" height="8" rx="4" fill="#1E293B"/>

  <!-- Laptop screen -->
  <rect x="140" y="140" width="200" height="160" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <rect x="154" y="154" width="172" height="132" rx="6" fill="url(#screenGrad)"/>

  <!-- Code lines -->
  <rect x="168" y="172" width="60" height="6" rx="3" fill="#3B82F6"/>
  <rect x="168" y="188" width="100" height="6" rx="3" fill="#94A3B8" opacity="0.6"/>
  <rect x="168" y="204" width="80" height="6" rx="3" fill="#06B6D4"/>
  <rect x="184" y="220" width="90" height="6" rx="3" fill="#94A3B8" opacity="0.5"/>
  <rect x="184" y="236" width="70" height="6" rx="3" fill="#94A3B8" opacity="0.5"/>
  <rect x="168" y="252" width="50" height="6" rx="3" fill="#3B82F6"/>
  <rect x="168" y="268" width="110" height="6" rx="3" fill="#94A3B8" opacity="0.4"/>

  <!-- Angle-bracket badge -->
  <g transform="translate(300,110)">
    <circle cx="0" cy="0" r="34" fill="url(#accentGrad)"/>
    <path d="M-12 -8 L-20 0 L-12 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 -8 L20 0 L12 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 -14 L-4 14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Cloud shape -->
  <g transform="translate(120,90)" opacity="0.9">
    <path d="M0 20c0-8 6-14 14-14 2-8 9-14 18-14 10 0 18 7 20 16 7 1 12 7 12 14 0 8-7 15-15 15H14c-8 0-14-6-14-14z" fill="#334155"/>
  </g>
</svg>
